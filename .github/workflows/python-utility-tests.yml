name: Python utility tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  utility-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Docker status and migration guard (no Docker required)
        run: python -m unittest discover -s tests -v
