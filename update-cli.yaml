# r14r/update-cli schema v2 project automation manifest.
# Source repository and target ref are configured by update-cli init/config,
# not in this manifest: https://r14r.github.io/update-cli/
schemaVersion: 2

project:
  name: OfficeHub
  type: docker-compose
  description: Local-first freelancer dashboard and Ollama services

defaults:
  failFast: true
  timeout: 30m

requirements:
  commands: [docker, just, python3]

run:
  command: just docker-start
  cwd: .

workflows:
  setup:
    tasks: [bootstrap]
  ci:
    tasks: [validate]

tasks:
  bootstrap:
    steps:
      - id: bootstrap-officehub
        name: Initialize environment, validate Compose, build and start OfficeHub
        shell: just bootstrap

  validate:
    steps:
      - id: compose-config
        name: Validate Docker Compose configuration
        shell: just docker-check
